version: '3.7'

# NOTE: The 'networks' block is kept as-is to allow containers to communicate
networks:
  default:
    name: workadventure-net

services:
    # ----------------------------------------
    # *** DELETED SERVICE: reverse-proxy ***
    # The original reverse-proxy (Traefik) service is REMOVED
    # because Coolify already runs a reverse proxy on ports 80/443.
    # ----------------------------------------

    # ----------------------------------------
    # front service (Frontend)
    # ----------------------------------------
    front:
        image: workadventu.re/front:latest
        restart: always
        env_file: .env
        # Removed the 'ports' section to avoid host port conflicts (80:80)
        expose:
            - 80
        # The internal Traefik labels are kept for internal consistency, 
        # but Coolify's proxy configuration will take precedence.
        labels:
            # Traefik labels for front (kept for reference, Coolify will override/re-route)
            - "traefik.enable=true"
            - "traefik.http.routers.front.rule=Host(`${DOMAIN}`, `play.${DOMAIN}`)"
            - "traefik.http.routers.front.entrypoints=websecure"
            - "traefik.http.routers.front.tls=true"
            - "traefik.http.services.front.loadbalancer.server.port=80"
        depends_on:
            - maps
            - pusher
            - back

    # ----------------------------------------
    # maps service (Map Storage)
    # ----------------------------------------
    maps:
        image: workadventu.re/map-storage:latest
        restart: always
        env_file: .env
        volumes:
            - maps:/usr/src/app/data
        # Removed the 'ports' section to avoid host port conflicts
        expose:
            - 8080
        labels:
            # Traefik labels for maps (kept for reference, Coolify will override/re-route)
            - "traefik.enable=true"
            - "traefik.http.routers.maps.rule=Host(`${MAP_STORAGE_DOMAIN}`)"
            - "traefik.http.routers.maps.entrypoints=websecure"
            - "traefik.http.routers.maps.tls=true"
            - "traefik.http.services.maps.loadbalancer.server.port=8080"

    # ----------------------------------------
    # back service (API Backend)
    # ----------------------------------------
    back:
        image: workadventu.re/back:latest
        restart: always
        env_file: .env
        expose:
            - 8000 # Internal port, not exposed to host

    # ----------------------------------------
    # pusher service (WebSockets)
    # ----------------------------------------
    pusher:
        image: workadventu.re/pusher:latest
        restart: always
        env_file: .env
        # Removed the 'ports' section to avoid host port conflicts
        expose:
            - 80
        labels:
            # Traefik labels for pusher (kept for reference, Coolify will override/re-route)
            - "traefik.enable=true"
            - "traefik.http.routers.pusher.rule=Host(`pusher.${DOMAIN}`)"
            - "traefik.http.routers.pusher.entrypoints=websecure"
            - "traefik.http.routers.pusher.tls=true"
            - "traefik.http.services.pusher.loadbalancer.server.port=80"
        depends_on:
            - back

    # ----------------------------------------
    # db service (PostgreSQL Database)
    # ----------------------------------------
    db:
        image: postgres:15-alpine
        restart: always
        env_file: .env
        volumes:
            - database:/var/lib/postgresql/data

    # ----------------------------------------
    # migrations service
    # ----------------------------------------
    migrations:
        image: workadventu.re/migrations:latest
        env_file: .env
        depends_on:
            - db

volumes:
    maps:
    database:
